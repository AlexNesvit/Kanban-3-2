services:
  api:
    build: .
    image: kanban-api:latest
    container_name: kanban-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/kanban
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: kanban-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
